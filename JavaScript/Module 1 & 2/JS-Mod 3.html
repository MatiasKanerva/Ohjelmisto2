<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Mod 1&2 - 3</title>
</head>
<body>
    Kirjoita 3 kokonaislukua: <input type="text" id="Teksti" value="1 2 3">
    <button onclick="Funktio()">Laske</button>
    <h1>Summa</h1>
    <p id="Summa"></p>

    <h1>Tulo</h1>
    <p id="Tulo"></p>

    <h1>Keskiarvo</h1>
    <p id="Keskiarvo"></p>
    <script>
        function Funktio() {
            const Luvut = document.getElementById("Teksti").value;
            const KokoLuku = Luvut.split(" ");
            
            const yksi = parseInt(KokoLuku[0]);
            const kaksi = parseInt(KokoLuku[1]);
            const kolme = parseInt(KokoLuku[2]);

            const Summa = yksi + kaksi + kolme;
            document.querySelector("#Summa").innerHTML = Summa

            const Tulo = yksi * kaksi * kolme;
            document.querySelector("#Tulo").innerHTML = Tulo

            const Keskiarvo = ((yksi + kaksi + kolme) / 3).toFixed(2)
            document.querySelector("#Keskiarvo").innerHTML = Keskiarvo
        }
    </script>
</body>
</html>
