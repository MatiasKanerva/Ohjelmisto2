<!DOCTYPE html>
<html lang="en">
<head>
    <title>JS-Mod 1 - 7</title>
</head>
<body>
    <h1>Nopan heitto</h1>
    Kuinka monta kertaa heität noppaa?: <input type="text" id="Teksti" value="1">
    <button onclick="NopanHeitto()">Valmis</button>
    <p id="Noppa"></p>
    <div id="TekstiKenttä">
    </div>
    <script>
        function NopanHeitto() {
            const Heitot = document.getElementById("Teksti").value;
            for (let index = 0; index < Heitot; index++) {
                let Randomi = Math.floor(Math.random() * 6) + 1;
                Summa = Randomi + Summa

                var param = document.createElement("p");
                var teksti = document.createTextNode("Heitit nopasta: " + Randomi);
                param.appendChild(teksti);
                document.body.appendChild(param);
            }
            document.querySelector("#Noppa").innerHTML = "Nopan heittojen summa on: " + Summa

            let Kenttä = document.getElementById("TekstiKenttä")
            if(!Kenttä){
                var param = document.createElement("p");
                var texti = document.createTextNode("Heitit nopasta: " + Randomi);
                param.appendChild(teksti);
                document.body.appendChild(param);
            } else {
                Kenttä.innerHTML = "";
            }
        }
        
    </script>
</body>
</html>
