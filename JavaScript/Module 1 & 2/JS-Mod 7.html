<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Mod 1&2 - 7</title>
</head>
<body>
    <h1>Nopan heitto</h1>
    Kuinka monta kertaa heität noppaa?: <input type="text" id="Teksti" value="1">
    <button onclick="Funktio()">Valmis</button>
    <p id="Noppa"></p>
    <script>
        function Funktio() {
            let Summa = 0
            const Heitot = document.getElementById("Teksti").value;
            for (let index = 0; index < Heitot; index++) {
                let Randomi = Math.floor(Math.random() * 6) + 1;
                Summa = Randomi + Summa;
            };
            document.querySelector("#Noppa").innerHTML = "Nopan heittojen summa on: " + Summa;
        }
    </script>
</body>
</html>
