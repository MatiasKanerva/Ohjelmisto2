<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Mod 3 - 9</title>
</head>
<body>
    <h1></h1>
    Kerro lukuja: <input type="text" id="Teksti" value="1 2 3 4 5 6">
    <button onclick="Funktio()">Valmis</button>
    <ul id="Target"></ul>
    <script>
        function Funktio() {
            const luku = document.getElementById("Teksti").value
            const splitti = luku.split(" ")
            let Taulukko2 = []
            let html_str = ""
            console.log(" Splitti: " + splitti)
            for (let i = 0; i < splitti.length; i++) {
                if (splitti[i] % 2 == 0) {
                    Taulukko2.push(splitti[i])
                    console.log("Jeee")
                }
            }
            html_str = html_str + "<li>" + "Sinun numerosi: " + splitti + "</li>" + "<li>" + "Parilliset numerot: " + Taulukko2 + "</li>"
            document.querySelector("#Target").innerHTML = html_str
        }
    </script>
</body>
</html>
