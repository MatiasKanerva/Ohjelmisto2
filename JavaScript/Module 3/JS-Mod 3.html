<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Mod 3 - 3</title>
</head>
<body>
    <h1></h1>
    Nimeä kuusi koiraa:
    <button onclick="Funktio()">Aloita</button>
    <ul id="Target"></ul>
    <script>
        function Funktio() {
            let Taulukko = []
            let html_str = ""
            let luku = 6
            for (let i = 0; i < 6; i++) {
                let Koira = prompt("Nimeä vielä " + luku + " koiraa: ");
                luku--
                Taulukko.push(Koira)
                Taulukko.sort()
                Taulukko.reverse()
            }
            for (let x = 0; x < Taulukko.length; x++) {
                html_str = html_str = html_str + "<li>" + Taulukko[x] + "</li>"
            }
            
            document.querySelector("#Target").innerHTML = html_str
        }
    </script>
</body>
</html>
